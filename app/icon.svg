<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    The EZee flower, never a lettermark "E".

    Geometry is lifted verbatim from public/logo-white.svg, which is the
    authoritative lockup, then translated so the mark's bounding box
    (x 32.25-109.91, y 32.64-120.50 in the lockup's coordinates) centres in
    a square. Do not redraw it by hand.

    White rounded tile rather than the brand blue the old "E" tile used:
    the mark's own accent IS brand blue, so on a blue tile the coloured
    petal and hexagon disappear and the whole thing reads as a grey
    asterisk. White also holds up against light and dark browser chrome.
  -->
